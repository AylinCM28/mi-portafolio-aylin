<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aylin M. | Portafolio de Ingeniería Informática</title>
  <meta name="description" content="Portafolio digital de Aylin Mariana Castulo Marin, estudiante de Ingeniería Informática. Proyectos de software, robótica, bases de datos y desarrollo web.">
  <meta name="theme-color" content="#101014">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101014'/%3E%3Cpath d='M16 46 L26 18 L32 18 L42 46 L35 46 L32.8 39 L24.8 39 L23 46 Z M26.8 33 L31 33 L29 25.5 Z' fill='%239B4DFF'/%3E%3Cpath d='M44 18 L48 18 L48 46 L44 46 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div class="progreso" aria-hidden="true"><span class="progreso__barra" id="progreso-barra"></span></div>

  <header class="cabecera" id="cabecera">
    <div class="contenedor cabecera__interior">
      <a class="marca" href="#inicio" aria-label="Aylin M. — Ir al inicio">
        <span class="marca__sello" aria-hidden="true">AM</span>
        <span class="marca__texto">Aylin M.</span>
      </a>

      <nav class="navegacion" aria-label="Navegación principal">
        <ul class="navegacion__lista" id="nav-escritorio"></ul>
      </nav>

      <button class="menu-boton" id="menu-boton" type="button" aria-expanded="false" aria-controls="menu-movil" aria-label="Abrir menú de navegación">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="menu-movil" id="menu-movil" hidden>
      <nav aria-label="Navegación móvil">
        <ul class="menu-movil__lista" id="nav-movil"></ul>
      </nav>
      <a class="menu-movil__contacto" href="#contacto">Contactarme</a>
    </div>
  </header>

  <main id="contenido">
    <section class="hero" id="inicio" aria-labelledby="hero-titulo">
      <div class="hero__fondo" aria-hidden="true">
        <span class="hero__orbita hero__orbita--1"></span>
        <span class="hero__orbita hero__orbita--2"></span>
        <span class="hero__rejilla"></span>
      </div>
      <div class="contenedor" id="hero-contenido"></div>
    </section>

    <section class="seccion" id="sobre-mi" aria-labelledby="sobre-mi-titulo">
      <div class="contenedor" id="sobre-mi-contenido"></div>
    </section>

    <section class="seccion seccion--alterna" id="formacion" aria-labelledby="formacion-titulo">
      <div class="contenedor" id="formacion-contenido"></div>
    </section>

    <section class="seccion" id="habilidades" aria-labelledby="habilidades-titulo">
      <div class="contenedor" id="habilidades-contenido"></div>
    </section>

    <section class="seccion seccion--alterna" id="cv" aria-labelledby="cv-titulo">
      <div class="contenedor" id="cv-contenido"></div>
    </section>

    <section class="seccion" id="proyectos" aria-labelledby="proyectos-titulo">
      <div class="contenedor" id="proyectos-contenido"></div>
    </section>

    <section class="seccion seccion--alterna" id="actividades" aria-labelledby="actividades-titulo">
      <div class="contenedor" id="actividades-contenido"></div>
    </section>

    <section class="seccion venados" id="venados" aria-labelledby="venados-titulo">
      <div class="contenedor" id="venados-contenido"></div>
    </section>

    <section class="seccion seccion--alterna" id="aprendizaje" aria-labelledby="aprendizaje-titulo">
      <div class="contenedor" id="aprendizaje-contenido"></div>
    </section>

    <section class="seccion contacto" id="contacto" aria-labelledby="contacto-titulo">
      <div class="contenedor" id="contacto-contenido"></div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor pie__interior">
      <div class="pie__identidad">
        <span class="marca__sello marca__sello--pequeno" aria-hidden="true">AM</span>
        <div>
          <p class="pie__nombre">Aylin M. <span id="pie-anio"></span></p>
          <p class="pie__detalle">Ingeniería Informática · Portafolio digital</p>
        </div>
      </div>
      <p class="pie__nota">Diseñado y desarrollado como presentación de proyectos y trayectoria académica.</p>
      <a class="pie__arriba" href="#inicio">Volver al inicio <span aria-hidden="true">↑</span></a>
    </div>
  </footer>

  <button class="volver-arriba" id="volver-arriba" type="button" aria-label="Volver al inicio de la página">
    <span aria-hidden="true">↑</span>
  </button>

  <div class="modal" id="modal-proyecto" hidden>
    <div class="modal__fondo" data-cerrar-modal></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1">
      <button class="modal__cerrar" id="modal-cerrar" type="button" aria-label="Cerrar detalle del proyecto">
        <span aria-hidden="true">×</span>
      </button>
      <div class="modal__contenido" id="modal-contenido"></div>
    </div>
  </div>

  <noscript>
    <div class="aviso-noscript">Este portafolio utiliza JavaScript para mostrar su contenido. Habilítalo para consultar todos los apartados.</div>
  </noscript>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
